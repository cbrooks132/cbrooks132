<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Website</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=Fraunces:opsz,wght@9..144,300;9..144,400&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-green: #1B5B31;
            --background-cream: #FDF9F3;
        }
        
        body {
            font-family: 'Fraunces', serif;
            line-height: 1.6;
            margin: 0;
            padding: 0;
            background-color: var(--background-cream);
            color: var(--primary-green);
        }
        
        .header {
            text-align: center;
            padding: 2rem;
            background-color: var(--background-cream);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .header h1 {
            font-family: 'Outfit', sans-serif;
            font-size: 1rem;
            font-weight: 700;
            margin: 0;
            color: var(--primary-green);
        }
        
        .content {
            padding: 4rem 2rem;
            max-width: 800px;
            margin: 0 auto;
        }
        
        h1 {
            font-family: 'Fraunces', serif;
            font-weight: 300;
            font-size: 3.5rem;
            color: var(--primary-green);
            margin-bottom: 2rem;
            line-height: 1.2;
        }
        
        .feature-section {
            padding: 0.1rem 0;
            display: flex;
            justify-content: center;
            align-items: center;
            text-decoration: none;
            color: var(--primary-green);
            transition: all 0.3s ease;
        }
        
        .feature-section h2 {
            font-family: 'Fraunces', serif;
            font-weight: 300;
            font-size: 6.5rem;
            margin: 0;
            text-align: center;
            transition: transform 0.3s ease;
        }
        
        .arrow-icon {
            width: 60px;
            height: 60px;
            border: 1px solid var(--primary-green);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background-color 0.3s;
            font-size: 1.5rem;
            position: absolute;
            right: 0;
        }
        
        .feature-section:hover {
            opacity: 0.7;
        }
        
        .feature-section:hover h2 {
            transform: scale(1.02);
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>cassia @ shopify</h1>
        <h1>~ vibe code prototypes ~</h1>
    </div>
    
    <div class="content">
        <a href="https://turbo-funicular-nr87y4v.pages.github.io/polaris-prototype/" class="feature-section">
            <h2>prototype 1</h2>
        </a>
        
        <a href="" class="feature-section">
            <h2>prototype 2</h2>
        </a>
        
        <a href="" class="feature-section">
            <h2>prototype 3</h2>
        </a>
        
        <a href="" class="feature-section">
            <h2>prototype 4</h2>
        </a>
    </div>
</body>
</html>
