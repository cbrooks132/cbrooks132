<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact - My Website</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,300;9..144,400&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-green: #1B5B31;
            --background-cream: #FDF9F3;
        }
        
        body {
            font-family: 'Inter', sans-serif;
            line-height: 1.6;
            margin: 0;
            padding: 0;
            background-color: var(--background-cream);
            color: var(--primary-green);
        }
        
        nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 2rem 4rem;
            background-color: var(--background-cream);
            border-bottom: 1px solid rgba(27, 91, 49, 0.1);
        }
        
        nav a {
            color: var(--primary-green);
            text-decoration: none;
            padding: 0.5rem 1rem;
            font-size: 1rem;
            transition: opacity 0.3s;
        }
        
        nav a:hover {
            opacity: 0.7;
        }
        
        .content {
            padding: 4rem 2rem;
            max-width: 800px;
            margin: 0 auto;
        }
        
        h1 {
            font-family: 'Fraunces', serif;
            font-weight: 300;
            font-size: 3.5rem;
            color: var(--primary-green);
            margin-bottom: 2rem;
            line-height: 1.2;
        }
        
        p {
            font-size: 1.1rem;
            color: var(--primary-green);
            opacity: 0.9;
            max-width: 600px;
            margin: 0 auto 2rem;
        }
        
        .button {
            display: inline-block;
            padding: 1rem 2rem;
            background-color: var(--primary-green);
            color: var(--background-cream);
            text-decoration: none;
            border-radius: 4px;
            font-size: 1.1rem;
            transition: opacity 0.3s;
            margin-top: 2rem;
        }
        
        .button:hover {
            opacity: 0.9;
        }
    </style>
</head>
<body>
    <nav>
        <a href="index.html">Home</a>
        <a href="about.html">About</a>
        <div style="font-family: 'Fraunces', serif; font-size: 1.5rem;">LOGO</div>
        <a href="services.html">Services</a>
        <a href="contact.html">Contact</a>
    </nav>
    
    <div class="content">
        <h1>Get Started</h1>
        <p>Ready to begin your journey to better health? Get in touch with us today and let's discuss how we can help you achieve your wellness goals.</p>
        <a href="#" class="button">Contact Us</a>
    </div>
</body>
</html>
