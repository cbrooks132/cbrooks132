name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      # Build React app
      - name: Build React App
        working-directory: my-polaris-app
        run: |
          npm install
          npm run build

      # Prepare deployment
      - name: Prepare deployment
        run: |
          # Create deployment directory
          mkdir -p ./deploy/cbrooks-shopify
          # Copy static files to root
          cp index.html ./deploy/cbrooks-shopify/
          cp about.html ./deploy/cbrooks-shopify/
          cp services.html ./deploy/cbrooks-shopify/
          cp contact.html ./deploy/cbrooks-shopify/
          # Copy React build
          mkdir -p ./deploy/cbrooks-shopify/polaris-prototype
          cp -r my-polaris-app/dist/* ./deploy/cbrooks-shopify/polaris-prototype/

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./deploy 